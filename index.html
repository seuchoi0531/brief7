<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <title>Expo 발표</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="theme-dark.css" />
    <script>
        function connect() {
            const evtSource = new EventSource("/events");
            evtSource.onmessage = () => {
                location.reload();
            };
            evtSource.onerror = () => {
                evtSource.close();
                setTimeout(connect, 1000);
            };
        }
        connect();
    </script>
</head>
